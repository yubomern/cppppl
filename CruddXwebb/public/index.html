<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tableau de bord — CRUD App</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
    <h1>📦 CRUD App — C++ / Boost.Beast</h1>
    <div class="user-info">
        <span id="whoami">...</span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Déconnexion</button>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h2>➕ Nouvel élément</h2>
        <form class="item-form" id="createForm">
            <input type="text" id="newTitle" placeholder="Titre" required>
            <input type="text" id="newDescription" placeholder="Description (optionnel)">
            <button type="submit" class="btn btn-primary">Ajouter</button>
        </form>
    </div>

    <div class="card">
        <h2>📋 Éléments</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Propriétaire</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
            Aucun élément pour le moment. Ajoutez-en un ci-dessus.
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
