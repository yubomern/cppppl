<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box card">
      <h1>Créer un compte</h1>
      <div id="err" class="error-msg" style="display:none"></div>
      <form id="regForm">
        <input type="text" id="username" placeholder="Nom d'utilisateur (min. 3 caractères)" required minlength="3">
        <input type="password" id="password" placeholder="Mot de passe (min. 6 caractères)" required minlength="6">
        <button type="submit">S'inscrire</button>
      </form>
      <p style="margin-top:16px;color:var(--muted)">
        Déjà un compte ? <a href="/login">Se connecter</a>
      </p>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.style.display = "none";
      try {
        const data = await apiPost("/api/register", {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        });
        window.location.href = data.redirect || "/dashboard";
      } catch (ex) {
        showError(err, ex);
      }
    });
  </script>
</body>
</html>
